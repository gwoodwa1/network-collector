parsers:
  xr_install_active_summary:
    type: regex
    fields:
      active_packages:
        pattern: '(?m)^\s+(disk0:\S+)'
        group: 1
        repeated: true
      profile:
        pattern: '(?m)^(.+ Profile):'
        group: 1
  xr_show_alarms_brief_system_active:
    type: regex
    fields:
      locations:
        pattern: '(?m)^(\S+)\s+(Major|Minor|Critical)\s+(\S+)\s+(\d{2}/\d{2}/\d{4}\s+\d{2}:\d{2}:\d{2}\s+\S+)\s+(.+)$'
        group: 1
        repeated: true
      severities:
        pattern: '(?m)^(\S+)\s+(Major|Minor|Critical)\s+(\S+)\s+(\d{2}/\d{2}/\d{4}\s+\d{2}:\d{2}:\d{2}\s+\S+)\s+(.+)$'
        group: 2
        repeated: true
      groups:
        pattern: '(?m)^(\S+)\s+(Major|Minor|Critical)\s+(\S+)\s+(\d{2}/\d{2}/\d{4}\s+\d{2}:\d{2}:\d{2}\s+\S+)\s+(.+)$'
        group: 3
        repeated: true
      set_times:
        pattern: '(?m)^(\S+)\s+(Major|Minor|Critical)\s+(\S+)\s+(\d{2}/\d{2}/\d{4}\s+\d{2}:\d{2}:\d{2}\s+\S+)\s+(.+)$'
        group: 4
        repeated: true
      descriptions:
        pattern: '(?m)^(\S+)\s+(Major|Minor|Critical)\s+(\S+)\s+(\d{2}/\d{2}/\d{4}\s+\d{2}:\d{2}:\d{2}\s+\S+)\s+(.+)$'
        group: 5
        repeated: true
  xr_show_interfaces_brief_records:
    type: regex_records
    root: interfaces
    pattern: '(?m)^(\S+)\s+(up|down|administratively down)\s+(up|down)\s+(.+)$'
    fields:
      interface:
        group: 1
      status:
        group: 2
      protocol:
        group: 3
      description:
        group: 4
  xr_show_interfaces_brief_textfsm:
    type: textfsm
    template: parser_templates/cisco_xr/show_interfaces_brief.textfsm
    root: interfaces
  xr_show_platform:
    type: textfsm
    template: parser_templates/cisco_xr/show_platform.textfsm
    root: nodes
  xr_show_route_summary:
    type: textfsm
    template: parser_templates/cisco_xr/show_route_summary.textfsm
    root: routes
  xr_show_ntp_associations:
    type: textfsm
    template: parser_templates/cisco_xr/show_ntp_associations.textfsm
    root: associations
  xr_show_ntp_status:
    type: textfsm
    template: parser_templates/cisco_xr/show_ntp_status.textfsm
    root: status
  xr_show_running_config_ntp:
    type: textfsm
    template: parser_templates/cisco_xr/show_running_config_ntp.textfsm
    root: ntp
  xr_facts_system:
    type: textfsm
    template: parser_templates/cisco_xr/show_version_facts.textfsm
    root: system
  xr_facts_lldp:
    type: textfsm
    template: parser_templates/cisco_xr/show_lldp_neighbors_detail.textfsm
    root: neighbors
  xr_facts_bgp:
    type: textfsm
    template: parser_templates/cisco_xr/show_bgp_summary.textfsm
    root: neighbors
  xr_facts_isis:
    type: textfsm
    template: parser_templates/cisco_xr/show_isis_neighbors.textfsm
    root: neighbors
  xr_facts_ldp:
    type: textfsm
