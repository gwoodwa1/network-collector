credentials:
  provider: cyberark
  timeout_seconds: 30
  cyberark:
    url: https://ccp.example/AIMWebService/api/Accounts
    app_id: NetworkCollector
    safe: Network-Automation
    object_prefix: collector-
    folder: Root
    reason: Network Collector automation
    ca_file: /etc/network-collector/ca.pem
    cert_file: /etc/network-collector/client.pem
    key_file: /etc/network-collector/client-key.pem

# Every nested field has a CYBERARK_* environment fallback. AppID application
# controls, source restrictions, and the optional client certificate authorize
# access; no CyberArk password is stored in this YAML.
