credentials:
  provider: 1password
  timeout_seconds: 30
  onepassword:
    account: automation.1password.com
    vault: Network Automation
    item_prefix: collector-
    username_field: username
    password_field: password

# Authenticate `op` with a least-privilege service account or an approved
# interactive session. OP_ACCOUNT, OP_VAULT, and OP_ITEM_PREFIX are environment
# fallbacks. OP_SERVICE_ACCOUNT_TOKEN remains in the environment, never YAML.
#
# credential_profile: datacenter reads fields username and password from the
# item named collector-datacenter.
