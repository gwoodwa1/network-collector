credentials:
  provider: command
  command: [examples/credential-providers/onepassword.sh]
  timeout_seconds: 30

# Authenticate `op` with a least-privilege service account or an approved
# interactive session, then set:
#   OP_VAULT=Network Automation
#   OP_ITEM_PREFIX=collector-
#
# credential_profile: datacenter reads fields username and password from the
# item named collector-datacenter.
