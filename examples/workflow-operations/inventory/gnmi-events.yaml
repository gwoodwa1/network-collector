hosts:
  - name: xr-gnmi-lab-01
    ip: 192.0.2.10
    type: cisco_iosxr
    operation_timeout: 60
    gnmi:
      port: 57400
      # Documentation-only certificate paths. Replace these with the CA and
      # client identity issued for this collector deployment.
      ca_file: ../../../certs/gnmi-ca.pem
      cert_file: ../../../certs/collector.pem
      key_file: ../../../certs/collector-key.pem
      server_name: xr-gnmi-lab-01.example.net
      timeout_seconds: 30
    labels:
      site: london
      role: core
      telemetry: gnmi

groups:
  gnmi-lab:
    hosts:
      - xr-gnmi-lab-01
