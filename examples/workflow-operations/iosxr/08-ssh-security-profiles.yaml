name_playbook: Mixed modern and legacy SSH estate
security_mode: permissive
inventory_file: ../inventory/security-profiles.yaml
parsers_file: ../../../parsers.yaml
fail_on_fail: true

# This workbook is an explicit legacy-device migration example. Permissive mode
# allows the inventory's legacy algorithm override, but host keys remain
# verified. Do not use permissive mode for a production-only modern estate.
ssh_security:
  profile: modern
  host_key_policy: known_hosts
  # known_hosts_file: ~/.ssh/known_hosts

execution:
  max_parallel: 2

ssh:
  - group: mixed-estate
    steps:
      - name: identify-negotiated-estate
        message: collecting through the verified modern profile or explicit inventory legacy override

      - name: show-version
        cmd: show version

      - name: show-platform
        cmd: show platform
        parser: xr_show_platform
