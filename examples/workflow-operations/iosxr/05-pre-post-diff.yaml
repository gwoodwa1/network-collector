name_playbook: Pre-change and post-change state diff
inventory_file: ../inventory.yaml
parsers_file: ../../../parsers.yaml
fail_on_fail: true

output:
  directory: artifacts
  save_raw: true
  summary_file: results.json

ssh:
  - group: xr-lab
    steps:
      - name: pre-change-checks
        message: capturing independent pre-change state
        parallel:
          max_parallel: 4
          steps:
            - {name: pre-platform, cmd: show platform, parser: xr_show_platform, register: pre_platform}
            - {name: pre-routes, cmd: show route summary, parser: xr_show_route_summary, register: pre_routes}
            - {name: pre-interfaces, cmd: show interfaces summary, register: pre_interfaces}
            - {name: pre-alarms, cmd: show alarms brief system active, register: pre_alarms}
            - {name: pre-ntp, cmd: show ntp status, register: pre_ntp}
            - {name: pre-redundancy, cmd: show redundancy summary, register: pre_redundancy}

      - name: pre-change-health-gate
        cmd: show alarms brief system active
        validation:
          extractor: regex
          pattern: '(?m)^(.*(Critical|Major).*)$'
          condition: not_contains
          # Any regex match contains the empty string and therefore fails;
          # no match satisfies not_contains. This rejects either severity.
          expected: ''
        on_fail:
          action: fail
          message: critical or major alarms are present; aborting before the change

      - name: authorize-change
        approval:
          message: Pre-checks passed. Continue to the change window?
          timeout_seconds: 300

      # Replace this message-only hook with tested change or upgrade steps.
      - name: perform-change
        message: CHANGE HOOK - insert the tested change workflow here

      - name: post-change-settle
        wait_seconds: 30
        message: allowing control-plane state to settle before post-checks

      - name: post-change-checks
        message: capturing independent post-change state
        parallel:
          max_parallel: 4
          steps:
            - name: post-platform
              cmd: show platform
              parser: xr_show_platform
              register: post_platform
              validation: &stable-platform {extractor: regex, pattern: '(?s)^(.*)$', condition: eq, expected: '{{pre_platform}}'}
            - name: post-routes
              cmd: show route summary
              parser: xr_show_route_summary
              register: post_routes
              validation: &stable-routes {extractor: regex, pattern: '(?s)^(.*)$', condition: eq, expected: '{{pre_routes}}'}
            - name: post-interfaces
              cmd: show interfaces summary
              register: post_interfaces
              validation: &stable-interfaces {extractor: regex, pattern: '(?s)^(.*)$', condition: eq, expected: '{{pre_interfaces}}'}
            - name: post-alarms
              cmd: show alarms brief system active
              register: post_alarms
              validation: &stable-alarms {extractor: regex, pattern: '(?s)^(.*)$', condition: eq, expected: '{{pre_alarms}}'}
            - name: post-ntp
              cmd: show ntp status
              register: post_ntp
              validation: &stable-ntp {extractor: regex, pattern: '(?s)^(.*)$', condition: eq, expected: '{{pre_ntp}}'}
            - name: post-redundancy
              cmd: show redundancy summary
              register: post_redundancy
              validation: &stable-redundancy {extractor: regex, pattern: '(?s)^(.*)$', condition: eq, expected: '{{pre_redundancy}}'}

      - name: change-window-complete
        message: post-check collection and Go-native stable-state comparisons completed
