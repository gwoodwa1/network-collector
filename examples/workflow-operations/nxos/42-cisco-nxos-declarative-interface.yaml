name_playbook: Declarative Cisco NX-OS SSH interface
inventory_file: ../inventory/multivendor-operations.yaml
fail_on_fail: true

vars:
  interface: Ethernet1/3
  interface_description: Example declarative customer handoff

output:
  directory: artifacts
  save_raw: true
  summary_file: results.json

ssh:
  - host: nxos-cli-01
    steps:
      - name: authorize-nxos-interface
        approval:
          message: Enable {{interface}} with description "{{interface_description}}"?
          timeout_seconds: 300

      - name: ensure-nxos-interface
        ensure:
          resource: interface
          name: "{{interface}}"
          state: enabled
          require_state: disabled
          description: "{{interface_description}}"
          transport: ssh
          rollback_on_failure: true
        register: interface_plan
