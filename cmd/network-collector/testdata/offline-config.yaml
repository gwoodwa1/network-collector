parsers_file: ../../../parsers.yaml

ssh:
  - hostname: fixture-xr-router
    ip: 192.0.2.10
    type: cisco_ios
    steps:
      - name: parse-install-active-summary
        cmd: show install active summary
        parser: xr_install_active_summary
        validations:
          - extractor: gjson
            json_path: active_packages.#
            condition: eq
            expected: 3
            expected_type: int
          - extractor: gjson
            json_path: profile
            condition: eq
            expected: Default Profile
            expected_type: string

      - name: parse-active-alarms
        cmd: show alarms brief system active
        parser: xr_show_alarms_brief_system_active
        validations:
          - extractor: gjson
            json_path: locations.#
            condition: eq
            expected: 7
            expected_type: int
          - extractor: gjson
            json_path: severities.5
            condition: eq
            expected: Critical
            expected_type: string
          - extractor: gjson
            json_path: descriptions.4
            condition: contains
            expected: Fabricq ASICs Offline
            expected_type: string

      - name: capture-baseline-alarms
        cmd: show alarms brief system active
        parser: xr_show_alarms_brief_system_active
        register: baseline_alarms

      - name: compare-final-alarms
        cmd: show alarms brief system active
        parser: xr_show_alarms_brief_system_active
        validation:
          extractor: gjson
          json_path: '@this'
          condition: eq
          expected: '{{baseline_alarms}}'
          expected_type: string

      - name: parse-interface-records
        cmd: show interfaces brief
        parser: xr_show_interfaces_brief_records
        validations:
          - extractor: gjson
            json_path: interfaces.#
            condition: eq
            expected: 3
            expected_type: int
          - extractor: gjson
            json_path: interfaces.1.status
            condition: eq
            expected: administratively down
            expected_type: string

      - name: parse-interfaces-textfsm
        cmd: show interfaces brief
        parser: xr_show_interfaces_brief_textfsm
        validations:
          - extractor: gjson
            json_path: interfaces.#
            condition: eq
            expected: 3
            expected_type: int
          - extractor: gjson
            json_path: interfaces.0.INTERFACE
            condition: eq
            expected: GigabitEthernet0/0/0/0
            expected_type: string

      - name: parse-ntp-associations
        cmd: show ntp associations
        parser: xr_show_ntp_associations
        validations:
          - extractor: gjson
            json_path: associations.#
            condition: gt
            expected: 0
            expected_type: int

      - name: parse-ntp-status
        cmd: show ntp status
        parser: xr_show_ntp_status
        validations:
          - extractor: gjson
            json_path: status.0.STATUS
            condition: eq
            expected: synchronized
            expected_type: string

      - name: parse-ntp-status-unsynchronized
        cmd: show ntp status
        parser: xr_show_ntp_status
        validations:
          - extractor: gjson
            json_path: status.0.STATUS
            condition: eq
            expected: unsynchronized
            expected_type: string
          - extractor: gjson
            json_path: status.0.LAST_UPDATE
            condition: eq
            expected: never updated
            expected_type: string

      - name: parse-running-config-ntp
        cmd: show running-config ntp
        parser: xr_show_running_config_ntp
        validations:
          - extractor: gjson
            json_path: ntp.#
            condition: eq
            expected: 2
            expected_type: int
