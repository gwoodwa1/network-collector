parsers_file: ../../../parsers.yaml
config_file: offline-config.yaml

cases:
  - name: xr-install-active-summary
    input: cli/xr_install_active_summary.txt
    config_ref:
      ssh_index: 0
      step: parse-install-active-summary

  - name: xr-show-alarms-brief-system-active
    input: cli/xr_show_alarms_brief_system_active.txt
    config_ref:
      ssh_index: 0
      step: parse-active-alarms

  - name: xr-active-alarms-unchanged
    baseline_input: cli/xr_show_alarms_before.txt
    input: cli/xr_show_alarms_after_unchanged.txt
    baseline_config_ref:
      ssh_index: 0
      step: capture-baseline-alarms
    config_ref:
      ssh_index: 0
      step: compare-final-alarms

  - name: xr-active-alarms-changed
    baseline_input: cli/xr_show_alarms_before.txt
    input: cli/xr_show_alarms_after_changed.txt
    baseline_config_ref:
      ssh_index: 0
      step: capture-baseline-alarms
    config_ref:
      ssh_index: 0
      step: compare-final-alarms
    expect_pass: false

  - name: xr-interface-regex-records
    input: cli/xr_show_interfaces_brief.txt
    config_ref:
      ssh_index: 0
      step: parse-interface-records

  - name: xr-interfaces-custom-textfsm
    input: cli/xr_show_interfaces_brief.txt
    config_ref:
      ssh_index: 0
      step: parse-interfaces-textfsm

  - name: xr-show-platform-textfsm
    input: cli/xr_show_platform.txt
    parser: xr_show_platform
    validations:
      - extractor: gjson
        json_path: nodes.0.NODE
        condition: eq
        expected: 0/RP0/CPU0
      - extractor: gjson
        json_path: nodes.2.STATE
        condition: eq
        expected: IOS XR RUN

  - name: xr-show-route-summary-textfsm
    input: cli/xr_show_route_summary.txt
    parser: xr_show_route_summary
    validations:
      - extractor: gjson
        json_path: routes.#(SOURCE=="connected").ROUTES
        condition: eq
        expected: '6'
      - extractor: gjson
        json_path: routes.#(SOURCE=="Total").MEMORY_BYTES
        condition: eq
        expected: '19540800'

  - name: xr-ntp-associations-synchronized
    input: cli/xr_show_ntp_associations_synced.txt
    config_ref:
      ssh_index: 0
      step: parse-ntp-associations
    validations:
      - extractor: gjson
        json_path: associations.1.MODE
        condition: eq
        expected: '*'
        expected_type: string
      - extractor: gjson
        json_path: associations.1.REMOTE
        condition: eq
        expected: 172.19.69.1
        expected_type: string

  - name: xr-ntp-associations-vrf-continuations
    input: cli/xr_show_ntp_associations_vrf.txt
    config_ref:
      ssh_index: 0
      step: parse-ntp-associations
    validations:
      - extractor: gjson
        json_path: associations.0.VRF
        condition: eq
        expected: VRF1
        expected_type: string
      - extractor: gjson
        json_path: associations.1.VRF
        condition: eq
        expected: ''
        expected_type: string

  - name: xr-ntp-associations-ipv6
    input: cli/xr_show_ntp_associations_ipv6.txt
    config_ref:
      ssh_index: 0
      step: parse-ntp-associations
    validations:
      - extractor: gjson
        json_path: associations.1.REMOTE
        condition: eq
        expected: '2001:db8:429a:3189::2'
        expected_type: string

  - name: xr-ntp-status-synchronized
    input: cli/xr_show_ntp_status_synced.txt
    config_ref:
      ssh_index: 0
      step: parse-ntp-status
    validations:
      - extractor: gjson
        json_path: status.0.LAST_UPDATE
        condition: eq
        expected: 66 sec ago
        expected_type: string

  - name: xr-ntp-status-unsynchronized
    input: cli/xr_show_ntp_status_unsynced.txt
    config_ref:
      ssh_index: 0
      step: parse-ntp-status-unsynchronized

  - name: xr-ntp-status-partial-eof-record
    input: cli/xr_show_ntp_status_partial.txt
    config_ref:
      ssh_index: 0
      step: parse-ntp-status
    validations:
      - extractor: gjson
        json_path: status.0.ROOT_DELAY
        condition: eq
        expected: '7.80'
        expected_type: string

  - name: xr-running-config-ntp
    input: cli/xr_show_running_config_ntp.txt
    config_ref:
      ssh_index: 0
      step: parse-running-config-ntp
    validations:
      - extractor: gjson
        json_path: ntp.1.VRF
        condition: eq
        expected: management
        expected_type: string
