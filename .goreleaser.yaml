version: 2

project_name: network-collector

before:
  hooks:
    - go mod tidy
    - go run github.com/CycloneDX/cyclonedx-gomod/cmd/cyclonedx-gomod@v1.9.0 mod -json -output sbom.cdx.json

builds:
  - id: network-collector
    main: ./cmd/network-collector
    binary: network-collector
    env:
      - CGO_ENABLED=0
    goos:
      - darwin
      - linux
      - windows
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w -X main.version={{.Version}}

  - id: xr-routing-monitor
    main: ./cmd/xr-routing-monitor
    binary: xr-routing-monitor
    env:
      - CGO_ENABLED=0
    goos:
      - darwin
      - linux
      - windows
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w -X main.version={{.Version}}

  - id: junos-routing-monitor
    main: ./cmd/junos-routing-monitor
    binary: junos-routing-monitor
    env:
      - CGO_ENABLED=0
    goos:
      - darwin
      - linux
      - windows
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w -X main.version={{.Version}}

archives:
  - id: network-collector
    ids:
      - network-collector
      - xr-routing-monitor
      - junos-routing-monitor
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    name_template: >-
      {{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}
    files:
      - LICENSE
      - README.md
      - CHANGELOG.md
      - VERSION
      - Dockerfile
      - .dockerignore
      - config.yaml
      - inventory.yaml
      - parsers.yaml
      - parser_templates/**/*
      - sbom.cdx.json
      - examples/modular/*
      - examples/credentials.example.yaml
      - examples/workflow-operations/**/*
      - skills.md

checksum:
  name_template: checksums.txt

changelog:
  disable: true

release:
  prerelease: auto
  header: |
    Network Collector v{{ .Version }}

    See `CHANGELOG.md` for highlights and the included example configuration files for a complete starting point.
