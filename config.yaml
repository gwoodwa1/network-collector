fail_on_fail: false
name_playbook: Software Upgrade on Cisco IOS
security_mode: production
inventory_file: inventory.yaml
parsers_file: parsers.yaml

# Stage SSH device runs: one canary, then up to three concurrent devices,
# with at least two minutes between starts.
execution:
  max_parallel: 3
  start_interval_seconds: 120
  canary_count: 1
  failure_threshold: 2

# Optional machine-readable artifacts. Each run gets its own timestamped
# directory containing raw CLI text, parsed JSON, and a run summary.
output:
  directory: artifacts
  save_raw: true
  save_parsed: true
  summary_file: results.json

ssh:
  - host: device-nxos-01
    cmd: show ip route
    validation:
      extractor: regex
      pattern: "Total routes:\\s+(\\d+)"
      condition: gt
      expected: 100
  - host: device-qfx-01
    cmd: show route
  - host: device-ios-01
    cmd: show system status
    validation:
      extractor: regex
      pattern: "System state:\\s+(\\w+)"
      condition: eq
      expected: "RUNNING"
      expected_type: string
  - host: device-ios-02
    cmd: show process memory
    validation:
      extractor: regex
      pattern: "Total memory:\\s+(\\d+)MB"
      condition: eq
      expected: 100
      expected_type: int

  - host: device-ios-03
    timeout: 20
    steps:
      - name: show-version
        cmd: show version
        validation:
          extractor: regex
          pattern: "System image file is \"(.+)\""
          condition: contains
          expected: flash
          expected_type: string

      - name: capture-install-id
        cmd: 'show install active | include "Install ID"'
        validation:
          extractor: regex
          pattern: 'Install ID:\s+(\d+)'
          condition: eq
          expected: 14
          expected_type: int
        register: install_id

      - name: show-install-by-id
        cmd: 'show install active {{install_id}}'
        retry:
          until_pass: true
          interval_seconds: 60
          max_attempts: 5
        validation:
          extractor: regex
          pattern: 'Package ID:\s+{{install_id}}'
          condition: contains
          expected: '{{install_id}}'
          expected_type: string

      - name: wait-for-reboot
        wait_seconds: 600
        ssh_probe:
          port: 22
          interval_seconds: 30
          max_attempts: 40
          timeout_seconds: 5
          post_wait_seconds: 120

  - host: xr-router-1
    timeout: 30
    steps:
      - name: enter-config
        cmd: configure terminal
      - name: set-isis-overload
        cmd: router isis 100
      - name: set-overload-bit
        cmd: ' address-family ipv4 unicast overload'
      - name: commit
        cmd: commit

  - host: xr-router-1
    timeout: 30
    cmd: "configure terminal\nrouter isis 100\n address-family ipv4 unicast overload\ncommit"
    validation:
      extractor: regex
      pattern: 'address-family ipv4 unicast overload'
      condition: contains
      expected: overload
      expected_type: string

netconf:
  - hostname: device-eos-05
    ip: 192.0.2.7
    type: arista_eos
    rpc: |
      <get>
        <filter type="subtree">
          <interfaces>
            <interface>
            </interface>
          </interfaces>
        </filter>
      </get>
  - hostname: device-eos
    ip: 192.0.2.8
    type: arista_eos
    rpc: |
      <get>
        <filter type="subtree">
          <interfaces>
            <interface>
            </interface>
          </interfaces>
        </filter>
      </get>
