fail_on_fail: false
name_playbook: Software Upgrade on Cisco IOS

restconf:
  - hostname: device-eos-02
    ip: 192.168.15.7
    port: 3333
    skip_tls: true
    method: GET
    endpoint: data/openconfig-interfaces:interfaces/interface

gnmi:
  - hostname: device-eos-01
    ip: 192.168.16.10:6030
    skip_tls: true
    path: /interfaces/interface/subinterfaces/subinterface/state/description
    validation:
      extractor: gjson
      json_path: "interfaces.0.interface.0.subinterfaces.0.subinterface.0.state.description"
      condition: contains
      expected: "up"

ssh:
  - hostname: device-nxos-01
    ip: 192.168.16.1
    type: cisco_nxos
    cmd: show ip route
    validation:
      extractor: regex
      pattern: "Total routes:\\s+(\\d+)"
      condition: gt
      expected: 100
  - hostname: device-qfx-01
    ip: 192.168.16.1
    type: juniper_junos
    cmd: show route
  - hostname: device-ios-01
    ip: 192.168.16.11
    type: cisco_ios
    cmd: show system status
    validation:
      extractor: regex
      pattern: "System state:\\s+(\\w+)"
      condition: eq
      expected: "RUNNING"
      expected_type: string
  - hostname: device-ios-02
    ip: 192.168.16.12
    type: cisco_ios
    cmd: show process memory
    validation:
      extractor: regex
      pattern: "Total memory:\\s+(\\d+)MB"
      condition: eq
      expected: 100
      expected_type: int

  - hostname: device-ios-03
    ip: 192.168.16.13
    type: cisco_ios
    timeout: 20
    steps:
      - name: show-version
        cmd: show version
        validation:
          extractor: regex
          pattern: "System image file is \"(.+)\""
          condition: contains
          expected: flash
          expected_type: string

      - name: capture-install-id
        cmd: 'show install active | include "Install ID"'
        validation:
          extractor: regex
          pattern: 'Install ID:\s+(\d+)'
          condition: eq
          expected: 14
          expected_type: int
        register: install_id

      - name: show-install-by-id
        cmd: 'show install active {{install_id}}'
        retry:
          until_pass: true
          interval_seconds: 60
          max_attempts: 5
        validation:
          extractor: regex
          pattern: 'Package ID:\s+{{install_id}}'
          condition: contains
          expected: '{{install_id}}'
          expected_type: string

      - name: wait-for-reboot
        wait_seconds: 600
        ssh_probe:
          port: 22
          interval_seconds: 30
          max_attempts: 40
          timeout_seconds: 5
          post_wait_seconds: 120

  - hostname: xr-router-1
    ip: 10.0.0.1
    type: cisco_xr
    timeout: 30
    steps:
      - name: enter-config
        cmd: configure terminal
      - name: set-isis-overload
        cmd: router isis 100
      - name: set-overload-bit
        cmd: ' address-family ipv4 unicast overload'
      - name: commit
        cmd: commit

  - hostname: xr-router-1
    ip: 10.0.0.1
    type: cisco_xr
    timeout: 30
    cmd: "configure terminal\nrouter isis 100\n address-family ipv4 unicast overload\ncommit"
    validation:
      extractor: regex
      pattern: 'address-family ipv4 unicast overload'
      condition: contains
      expected: overload
      expected_type: string

http:
  - hostname: device-eos-08
    ip: 192.168.16.8
    type: arista_eos
    cmd: show version
    skip_tls: true
  - hostname: device-eos-03
    ip: 192.168.16.9
    type: arista_eos
    cmd: show ip route
    skip_tls: true

netconf:
  - hostname: device-eos-05
    ip: 192.168.16.7
    type: arista_eos
    rpc: |
      <get>
        <filter type="subtree">
          <interfaces>
            <interface>
            </interface>
          </interfaces>
        </filter>
      </get>
  - hostname: device-eos
    ip: 192.168.15.8
    type: arista_eos
    rpc: |
      <get>
        <filter type="subtree">
          <interfaces>
            <interface>
            </interface>
          </interfaces>
        </filter>
      </get>
